name: hr-vacation

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      VACATION_DB_PATH: /app/server/data/vacations.sqlite
    volumes:
      - ./server/data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

